# Checks: free, offline tests (reply linter, hooks, eval folders, skill metadata). No model calls.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -I -m unittest discover -s tests -v

      - name: Every published number matches launch/facts.json
        run: python3 -I tools/sync.py check . --no-outward

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Thread deck logic tests
        run: node --test 'tests/deck/*_spec.ts'

  action:
    name: Action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Good replies pass
        uses: ./
        with:
          files: tests/fixtures/good/*.md

      - name: Bad reply fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          files: tests/fixtures/bad/F5-paste-ask.md

      - name: Check the bad reply failed
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          PROBLEMS: ${{ steps.bad.outputs.problems }}
        run: |
          test "$OUTCOME" = failure
          test "$PROBLEMS" = 1
